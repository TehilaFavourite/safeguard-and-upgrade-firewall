[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Transient storage (EIP-1153) for the reentrancy flag and pre->post outflow handoff (ADR 0005, 0012).
# `transient` state variables need solc >= 0.8.28; tstore/tload via assembly needs >= 0.8.24.
solc_version = "0.8.28"
evm_version = "cancun"
# Optimizer ON, 200 runs (ADR 0022): size is the binding constraint, because GuardFactory embeds the
# guard's init code under EIP-170.
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Read from .env (git-ignored). Never commit the URL.
# Fork tests fetch accounts and storage over RPC. Throttle and retry so fuzzing on the fork variant
# doesn't hit provider rate limits (HTTP 429 observed in Phase 1; ADR 0013). retry_backoff is in ms.
mainnet = { endpoint = "${ETH_RPC_URL}", retries = 5, retry_backoff = 1000, compute_units_per_second = 100 }

[doc]
out = "docs/forge"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
