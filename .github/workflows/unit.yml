# Unit job (ADR 0013): every push, no secrets. Runs the unit variant in parallel, plus every gate.
name: unit

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (tests and gates)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          submodules: recursive

      # Pinned exactly (ADR 0022). Never "stable" or "latest": an unpinned forge broke CI once.
      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: v1.8.5

      - name: Check forge version
        run: forge --version | tee /dev/stderr | grep -q '^forge Version: 1.8.5'

      - name: Format
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Unit tests (parallel)
        run: forge test --no-match-contract 'ForkTest|ForkInfra'

      - name: Coverage gate
        run: ./script/check-coverage-complete.sh

      - name: Contract size gate
        run: ./script/check-contract-sizes.sh

      - name: Guard opcode gate
        run: ./script/check-guard-opcodes.sh

      - name: Seam override gate
        run: ./script/check-seam-overrides.sh

      - name: Gas snapshot
        run: ./script/gas-snapshot.sh --check

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Slither (pinned)
        run: pip install slither-analyzer==0.11.6 crytic-compile==0.4.2

      - name: Slither gate
        run: ./script/check-slither.sh
